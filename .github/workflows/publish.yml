name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'  # only trigger on semiversion tags

permissions:
  contents: read  # restrict unnecessary permissions by default

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build source + wheel
        run: python -m build

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-files
          path: dist/

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    environment:
      name: pypi
    permissions:
      id-token: write   # REQUIRED for OIDC Trusted Publishing

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-files
          path: dist/

      - name: Publish to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        # <-- NO 'with: password:' block here; Trusted Publishing uses OIDC :contentReference[oaicite:1]{index=1}
